name: Publish Platform Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag matching package.json, for example v0.0.2
        required: true
        type: string
      prerelease:
        description: Mark the GitHub release as a prerelease
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  package:
    name: Package ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS
            runner: macos-latest
            command: ./pet package-macos
            artifact: Petfy-macos
            path: dist/macos/*.zip
          - label: Windows
            runner: windows-latest
            command: pet.cmd package-windows
            artifact: Petfy-windows
            path: dist/windows/*.zip
          - label: Linux
            runner: ubuntu-latest
            command: ./pet package-linux
            artifact: Petfy-linux
            path: dist/linux/*.tar.gz
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Verify release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node -e 'const version = require("./package.json").version; if (process.env.RELEASE_TAG !== `v${version}`) { throw new Error(`Expected v${version}, received ${process.env.RELEASE_TAG}`); }'

      - name: Validate Flutter app
        if: runner.os != 'Windows'
        run: |
          ./pet analyze
          ./pet test

      - name: Validate Flutter app on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          pet.cmd analyze
          pet.cmd test

      - name: Validate bridge
        run: npm run test:bridge

      - name: Package platform asset
        shell: bash
        if: runner.os != 'Windows'
        run: ${{ matrix.command }}

      - name: Package Windows asset
        if: runner.os == 'Windows'
        shell: cmd
        run: ${{ matrix.command }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          IS_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          args=("$RELEASE_TAG" release-assets/* --title "Petfy $RELEASE_TAG" --generate-notes --target "$GITHUB_SHA")
          if [ "$IS_PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
